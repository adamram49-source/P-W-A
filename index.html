<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>האפליקציה המעודכנת שלי</title>

    <script>
        // מניפסט מעודכן - שינינו צבע נושא
        const manifest = {
            "name": "Pro App V2",
            "short_name": "V2 App",
            "start_url": ".",
            "display": "standalone",
            "background_color": "#121212",
            "theme_color": "#ff9800",
            "icons": [{
                "src": "https://cdn-icons-png.flaticon.com/512/2583/2583158.png",
                "sizes": "512x512",
                "type": "image/png",
                "purpose": "any maskable"
            }]
        };
        const stringManifest = JSON.stringify(manifest);
        const blob = new Blob([stringManifest], {type: 'application/json'});
        const manifestURL = URL.createObjectURL(blob);
        const link = document.createElement('link');
        link.rel = 'manifest';
        link.href = manifestURL;
        document.head.appendChild(link);
    </script>

    <style>
        /* שינוי עיצוב משמעותי - Dark Mode */
        body {
            font-family: 'Arial', sans-serif;
            background-color: #121212;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .container {
            text-align: center;
            border: 2px solid #ff9800;
            padding: 40px;
            border-radius: 30px;
            background: #1e1e1e;
            box-shadow: 0 0 20px rgba(255, 152, 0, 0.2);
        }

        h1 { color: #ff9800; font-size: 3rem; margin: 0; }
        .version-badge {
            background: #ff9800;
            color: black;
            padding: 5px 15px;
            border-radius: 20px;
            font-weight: bold;
            display: inline-block;
            margin-bottom: 20px;
        }

        /* אלמנט ויזואלי חדש - מד מהירות */
        .gauge {
            width: 150px;
            height: 150px;
            border: 10px solid #333;
            border-top: 10px solid #ff9800;
            border-radius: 50%;
            margin: 20px auto;
            animation: spin 2s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        button {
            background: linear-gradient(45deg, #ff9800, #f44336);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 20px;
            border-radius: 50px;
            cursor: pointer;
            display: none;
            font-weight: bold;
            box-shadow: 0 5px 15px rgba(255, 152, 0, 0.4);
        }

        @media (display-mode: standalone) {
            .web-only { display: none !important; }
            body { border: 10px solid #ff9800; box-sizing: border-box; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="version-badge">גרסה 2.0 - עודכן!</div>
        <h1>PRO APP</h1>
        
        <div class="web-only">
            <p>האם ראית את השינוי? האתר הפך לכהה!</p>
            <button id="install-btn">התקן גרסה 2 🚀</button>
        </div>

        <div class="app-only" style="display: none;">
            <p>ברוכים הבאים לממשק האפליקציה החדש!</p>
            <div class="gauge"></div>
            <p>הכל פועל כשורה ובצורה מאובטחת.</p>
        </div>
    </div>

    <script>
        // שינוי ה-CACHE_NAME ל-v2 גורם לעדכון להיכנס לתוקף
        const swCode = `
            const CACHE_NAME = 'pwa-v2'; 
            self.addEventListener('install', (e) => {
                e.waitUntil(caches.open(CACHE_NAME).then(c => c.addAll(['/'])));
                self.skipWaiting();
            });
            self.addEventListener('activate', (e) => {
                e.waitUntil(caches.keys().then(keys => Promise.all(
                    keys.map(k => k !== CACHE_NAME && caches.delete(k))
                )));
            });
            self.addEventListener('fetch', (e) => {
                e.respondWith(caches.match(e.request).then(res => res || fetch(e.request)));
            });
        `;

        const swBlob = new Blob([swCode], {type: 'application/javascript'});
        const swURL = URL.createObjectURL(swBlob);

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register(swURL);
        }

        // לוגיקת התקנה
        let deferredPrompt;
        const btn = document.getElementById('install-btn');

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            btn.style.display = 'block';
        });

        btn.addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                deferredPrompt = null;
            }
        });

        // הצגת תוכן שונה לאפליקציה
        if (window.matchMedia('(display-mode: standalone)').matches) {
            document.querySelector('.app-only').style.display = 'block';
            document.querySelector('.web-only').style.display = 'none';
        }
    </script>
</body>
</html>
